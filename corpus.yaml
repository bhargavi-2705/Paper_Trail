# Topics the knowledge base is *supposed* to cover.
syllabus:
  - transformers
  - attention
  - positional-encoding
  - pretraining
  - fine-tuning
  - peft
  - retrieval
  - dense-retrieval
  - rag
  - prompting
  - reasoning
  - in-context-learning
  - optimization
  - normalization
  - regularization
  - residual-connections
  - scaling
  - evaluation-metrics          # unlabelled on purpose: genuinely thin
  - reinforcement-learning      # control: only passing mentions
  - graph-neural-networks       # control
  - generative-adversarial-networks   # control
  - speech-recognition          # control
  - recommender-systems         # control
  - time-series-forecasting     # control

# Natural-language queries. Bare slugs and acronyms ('peft') retrieve badly.
topic_queries:
  transformers: "the Transformer neural network architecture"
  attention: "attention mechanism in neural networks"
  positional-encoding: "positional encodings for sequence order in transformers"
  pretraining: "pre-training language models on unlabelled text"
  fine-tuning: "fine-tuning a pre-trained model on a downstream task"
  peft: "parameter-efficient fine-tuning of large language models"
  retrieval: "retrieving relevant passages for a query"
  dense-retrieval: "dense vector retrieval with learned embeddings"
  rag: "retrieval-augmented generation"
  prompting: "prompting language models with examples"
  reasoning: "step-by-step reasoning in language models"
  in-context-learning: "in-context learning from a few examples without gradient updates"
  optimization: "stochastic gradient optimization algorithms"
  normalization: "normalizing layer activations during training"
  regularization: "regularization to reduce overfitting"
  residual-connections: "residual connections in very deep networks"
  scaling: "scaling model size and its effect on performance"
  evaluation-metrics: "evaluation metrics for model quality"
  reinforcement-learning: "reinforcement learning with rewards and policies"
  graph-neural-networks: "graph neural networks on graph-structured data"
  generative-adversarial-networks: "generative adversarial networks with a generator and discriminator"
  speech-recognition: "automatic speech recognition from audio"
  recommender-systems: "recommender systems for user preferences"
  time-series-forecasting: "time series forecasting"

# What YOU know about this corpus. These test whether the detector works at all.
known_present: [transformers, attention, positional-encoding, pretraining, fine-tuning, peft,
                retrieval, dense-retrieval, rag, prompting, reasoning, in-context-learning,
                optimization, normalization, residual-connections]
known_absent: [reinforcement-learning, graph-neural-networks, generative-adversarial-networks,
               speech-recognition, recommender-systems, time-series-forecasting]
