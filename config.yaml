data_dir: data/raw
index_dir: index
collection: notes

embedding:
  model: BAAI/bge-small-en-v1.5 # 130MB, CPU-friendly; "fake" is for tests only
  query_prefix: "Represent this sentence for searching relevant passages: "

chunking:
  strategy: fixed # fixed | per_page
  chunk_chars: 1200
  overlap_chars: 200
  min_chars: 80 # drops page numbers / stray header fragments

retrieval:
  top_k: 5 # chunks passed to the generator
  candidate_k: 20 # candidates fetched before reranking
  hybrid: false # dense + BM25 fused with Reciprocal Rank Fusion
  rrf_k: 60
  rerank: true
  rerank_model: cross-encoder/ms-marco-MiniLM-L-6-v2

agent:
  enabled: false # LangGraph loop; false = plain baseline chain
  decompose: true
  critic: true
  max_requeries: 1
  max_subquestions: 3

llm:
  provider: openai
  model: openai/gpt-oss-20b
  base_url: https://api.groq.com/openai/v1
  max_tokens: 2000
  temperature: 0
  reasoning_effort: low
